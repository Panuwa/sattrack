<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Satellite Tracker · ติดตามดาวเทียม</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛰️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
} }
</script>
<style>
  :root {
    --bg: #05080F;
    --bar: rgba(13, 19, 32, .92);
    --panel: rgba(17, 25, 41, .94);
    --line: #26324A;
    --text: #E4EAF3;
    --text-2: #8C9AB3;
    --accent: #4DA3FF;
    font-family: "IBM Plex Sans Thai", "Noto Sans Thai", system-ui, sans-serif;
    color: var(--text);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
  #globe { position: fixed; inset: 0; }
  #globe canvas { display: block; touch-action: none; }
  .num { font-variant-numeric: tabular-nums; }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* แถบบน */
  header {
    position: fixed; top: 0; left: 0; right: 0; height: calc(52px + env(safe-area-inset-top));
    padding: env(safe-area-inset-top) 12px 0; display: flex; align-items: center; gap: 10px;
    background: var(--bar); border-bottom: 1px solid var(--line); z-index: 20; backdrop-filter: blur(6px);
  }
  .brand { font-weight: 600; font-size: 1rem; white-space: nowrap; margin-right: auto; display: flex; align-items: center; gap: 8px; }
  .nav-btn {
    background: none; border: 1px solid transparent; border-radius: 6px; padding: 6px 10px; color: var(--text-2); font-size: .9rem; white-space: nowrap;
  }
  .nav-btn:hover, .nav-btn[aria-expanded=true] { color: var(--text); border-color: var(--line); }
  .search-wrap { position: relative; }
  #search {
    width: 230px; background: #0B1220; border: 1px solid var(--line); border-radius: 18px; padding: 6px 14px; font-size: .88rem;
  }
  #results {
    position: absolute; right: 0; top: 40px; width: 320px; max-height: 60vh; overflow-y: auto; list-style: none; margin: 0; padding: 4px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px; display: none;
  }
  #results.open { display: block; }
  #results button { width: 100%; text-align: left; background: none; border: 0; border-radius: 5px; padding: 7px 8px; font-size: .88rem; display: flex; gap: 8px; align-items: center; }
  #results button:hover, #results button:focus-visible { background: #1B2740; }
  #results .sub { color: var(--text-2); font-size: .78rem; margin-left: auto; }
  .lang { display: flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .lang button { background: none; border: 0; padding: 5px 9px; font-size: .8rem; color: var(--text-2); }
  .lang button[aria-pressed=true] { background: var(--accent); color: #fff; }

  /* เมนูระบบดาวเทียม */
  #drawer {
    position: fixed; top: calc(60px + env(safe-area-inset-top)); left: 12px; width: 290px; max-height: calc(100dvh - 140px); overflow-y: auto;
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; z-index: 15; display: none;
  }
  #drawer.open { display: block; }
  .panel-title { font-weight: 600; font-size: .95rem; margin: 0 0 8px; }
  .groups { list-style: none; margin: 0; padding: 0; }
  .groups label { display: grid; grid-template-columns: 16px 12px 1fr auto; gap: 9px; align-items: center; padding: 6px 2px; cursor: pointer; font-size: .9rem; }
  .groups input { margin: 0; accent-color: var(--accent); }
  .sw { width: 12px; height: 12px; border-radius: 3px; }
  .count { color: var(--text-2); font-size: .78rem; }

  /* คำอธิบายสี (ขวาล่าง) */
  #legend {
    position: fixed; right: 12px; bottom: calc(66px + env(safe-area-inset-bottom)); width: 220px; background: var(--panel);
    border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; z-index: 10; font-size: .84rem;
  }
  #legend ul { list-style: none; margin: 0; padding: 0; }
  #legend li { display: flex; align-items: center; gap: 9px; padding: 4px 0; }
  #legend li .count { margin-left: auto; }
  #legend .total { border-top: 1px solid var(--line); margin-top: 8px; padding-top: 8px; color: var(--text-2); font-size: .78rem; }

  /* ข้อมูลดาวเทียมที่เลือก */
  #info {
    position: fixed; top: calc(60px + env(safe-area-inset-top)); right: 12px; width: 300px; background: var(--panel);
    border: 1px solid var(--line); border-radius: 10px; padding: 14px; z-index: 12; display: none; max-height: calc(100dvh - 330px); overflow-y: auto;
  }
  #info.open { display: block; }
  .info-head { display: flex; align-items: flex-start; gap: 8px; }
  .info-name { font-weight: 600; font-size: 1.05rem; line-height: 1.3; }
  .info-sub { color: var(--text-2); font-size: .8rem; margin-top: 2px; }
  .x { margin-left: auto; background: none; border: 0; color: var(--text-2); font-size: 1.2rem; line-height: 1; padding: 2px 4px; }
  .heading { display: flex; align-items: center; gap: 12px; margin: 12px 0 4px; }
  .arrow { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); display: grid; place-items: center; flex: none; }
  .arrow svg { transition: transform .4s; }
  dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; margin: 10px 0 0; font-size: .86rem; }
  dt { color: var(--text-2); }
  dd { margin: 0; text-align: right; }
  .actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .btn { background: #1B2740; border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px; font-size: .85rem; }
  .btn:hover { border-color: var(--text-2); }
  .btn.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  table { width: 100%; border-collapse: collapse; font-size: .8rem; margin-top: 10px; }
  th, td { text-align: left; padding: 5px 3px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--text-2); font-weight: 500; }
  .note { color: var(--text-2); font-size: .78rem; margin: 8px 0 0; line-height: 1.5; }

  /* แถบเวลาด้านล่าง */
  footer {
    position: fixed; left: 0; right: 0; bottom: 0; height: calc(54px + env(safe-area-inset-bottom)); padding: 0 12px env(safe-area-inset-bottom);
    background: var(--bar); border-top: 1px solid var(--line); display: flex; align-items: center; gap: 14px; z-index: 20; backdrop-filter: blur(6px);
  }
  .clock { display: flex; flex-direction: column; line-height: 1.2; }
  .clock .t { font-size: 1.05rem; font-weight: 500; }
  .clock .d { font-size: .74rem; color: var(--text-2); }
  .tc { display: flex; gap: 4px; margin-left: auto; align-items: center; }
  .tc button { width: 36px; height: 34px; background: #1B2740; border: 1px solid var(--line); border-radius: 6px; display: grid; place-items: center; }
  .tc button:hover { border-color: var(--text-2); }
  .speed { min-width: 64px; text-align: center; font-size: .82rem; color: var(--text-2); }
  .status { font-size: .74rem; color: var(--text-2); }

  #tip { position: fixed; pointer-events: none; background: #0B1220; border: 1px solid var(--line); color: var(--text); font-size: .78rem; padding: 3px 8px; border-radius: 4px; transform: translate(12px, -130%); display: none; z-index: 30; white-space: nowrap; }

  /* หน้าต่างเชื่อม Claude */
  dialog { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 12px; max-width: 440px; padding: 20px; }
  dialog::backdrop { background: rgba(0,0,0,.6); }
  dialog code { display: block; background: #0B1220; border: 1px solid var(--line); border-radius: 6px; padding: 9px; font-size: .82rem; word-break: break-all; margin: 10px 0; }
  dialog p { font-size: .88rem; line-height: 1.6; color: var(--text-2); margin: 6px 0; }

  @media (max-width: 760px) {
    header { gap: 6px; padding-left: 8px; padding-right: 8px; }
    .brand { margin-right: 0; }
    .brand span, #claude-btn { display: none; }
    .nav-btn { padding: 6px 6px; }
    .search-wrap { flex: 1; min-width: 0; }
    #search { width: 100%; }
    #results { width: calc(100vw - 16px); right: auto; left: 50%; transform: translateX(-50%); position: fixed; top: calc(56px + env(safe-area-inset-top)); }
    #legend { display: none; }
    #info { left: 8px; right: 8px; width: auto; top: auto; bottom: calc(62px + env(safe-area-inset-bottom)); max-height: 46dvh; }
    #drawer { left: 8px; right: 8px; width: auto; }
    .clock .d { display: none; }
    .status { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { .arrow svg { transition: none; } }
</style>
</head>
<body>
<div id="globe"></div>

<header>
  <div class="brand">🛰️ <span data-i18n="brand"></span></div>
  <button class="nav-btn" id="groups-btn" aria-expanded="false" aria-controls="drawer" data-i18n="systems"></button>
  <button class="nav-btn" id="claude-btn" data-i18n="useClaude"></button>
  <div class="search-wrap">
    <input type="search" id="search" autocomplete="off" data-i18n-placeholder="searchPh" aria-label="search">
    <ul id="results"></ul>
  </div>
  <div class="lang" role="group" aria-label="Language">
    <button data-lang="th" aria-pressed="true">ไทย</button>
    <button data-lang="en" aria-pressed="false">EN</button>
  </div>
</header>

<section id="drawer" aria-label="systems">
  <p class="panel-title" data-i18n="systems"></p>
  <ul class="groups" id="groups"></ul>
  <button class="btn" id="claude-btn2" style="margin-top:10px;width:100%" data-i18n="useClaude"></button>
</section>

<aside id="legend">
  <p class="panel-title" data-i18n="legend"></p>
  <ul id="legend-list"></ul>
  <div class="total num" id="total"></div>
</aside>

<aside id="info" aria-live="polite"></aside>

<footer>
  <div class="clock num"><span class="t" id="clock">--:--:--</span><span class="d" id="date"></span></div>
  <span class="status" id="status"></span>
  <div class="tc">
    <button id="slower" data-i18n-title="slower" aria-label="slower"><svg width="16" height="16" viewBox="0 0 16 16"><path d="M8 3v10L1 8zM15 3v10L8 8z" fill="currentColor"/></svg></button>
    <button id="play" data-i18n-title="pause" aria-label="pause"><svg width="16" height="16" viewBox="0 0 16 16" id="play-icon"><path d="M4 2h3v12H4zM9 2h3v12H9z" fill="currentColor"/></svg></button>
    <button id="faster" data-i18n-title="faster" aria-label="faster"><svg width="16" height="16" viewBox="0 0 16 16"><path d="M8 3v10l7-5zM1 3v10l7-5z" fill="currentColor"/></svg></button>
    <span class="speed num" id="speed">×1</span>
    <button id="reset" data-i18n-title="now" aria-label="now"><svg width="16" height="16" viewBox="0 0 16 16"><path d="M13.5 8A5.5 5.5 0 1 1 8 2.5c1.6 0 3 .7 4 1.8V2h1.5v4.8H8.7V5.3h2.4A4 4 0 1 0 12 8z" fill="currentColor"/></svg></button>
  </div>
</footer>

<div id="tip"></div>

<dialog id="claude-dlg">
  <h3 style="margin:0 0 6px" data-i18n="useClaude"></h3>
  <p data-i18n="claudeHelp"></p>
  <code id="mcp-url"></code>
  <p data-i18n="claudeEx"></p>
  <div class="actions"><button class="btn" id="copy" data-i18n="copy"></button><button class="btn" id="dlg-close" data-i18n="close"></button></div>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/satellite.js@6.0.2/dist/satellite.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GROUPS, packOMM, unpackRow, makeRecord, positionAt, motionAt, groundTrack, predictPasses, compassTh, compassEn } from './orbit-core.js';

const S = window.satellite;
const $ = id => document.getElementById(id);

// ---------------- ภาษา / i18n ----------------
const I18N = {
  th: {
    brand: 'ติดตามดาวเทียม', systems: 'ระบบดาวเทียม', legend: 'กำลังแสดง', useClaude: 'ใช้กับ Claude',
    searchPh: 'ค้นหาชื่อ หรือเลข NORAD', slower: 'ช้าลง / ย้อนเวลา', faster: 'เร็วขึ้น', pause: 'หยุด / เล่น', now: 'กลับมาเวลาปัจจุบัน',
    total: n => `รวม ${n} ดวง`, none: 'เปิดระบบดาวเทียมจากเมนู “ระบบดาวเทียม”', loading: 'กำลังโหลด…',
    loadFail: (g, e) => `โหลด ${g} ไม่สำเร็จ: ${e}`, notFound: 'ไม่พบในระบบที่เปิดอยู่ ลองเปิดระบบเพิ่มในเมนู “ระบบดาวเทียม”',
    heading: d => `มุ่งหน้าทิศ${d}`, north: 'กำลังขึ้นเหนือ', south: 'กำลังลงใต้',
    lat: 'ละติจูด', lon: 'ลองจิจูด', alt: 'ความสูง', speed: 'ความเร็ว', period: 'โคจรรอบละ', age: 'อายุข้อมูลวงโคจร',
    km: 'กม.', kms: 'กม./วินาที', min: 'นาที', hr: 'ชม.', days: 'วัน',
    track: 'ติดตาม', tracking: 'กำลังติดตาม', passes: 'เวลาผ่านเหนือฉัน', close: 'ปิด',
    propFail: 'คำนวณตำแหน่งไม่ได้ ข้อมูลวงโคจรอาจเก่าเกินไป',
    askLoc: 'กำลังขอตำแหน่งของคุณ…', locFail: 'ไม่ได้รับตำแหน่ง อนุญาตให้เบราว์เซอร์เข้าถึงตำแหน่งแล้วกดอีกครั้ง',
    geo: 'ดาวเทียมดวงนี้อยู่วงโคจรค้างฟ้า จะอยู่ที่ตำแหน่งเดิมบนท้องฟ้าตลอด จึงไม่มีช่วงโคจรผ่าน',
    passStart: 'เริ่มเห็น', passMax: 'สูงสุด', passDir: 'จากทิศ → ไปทิศ',
    passNote: '48 ชม. ข้างหน้า มุมเงยอย่างน้อย 10° (ยังไม่ได้คิดว่ามองเห็นด้วยตาเปล่าได้หรือไม่)',
    noPass: 'ไม่ผ่านเหนือตำแหน่งของคุณที่มุมเงย 10° ขึ้นไปใน 48 ชม. ข้างหน้า',
    paused: 'หยุด', updated: t => `อัปเดต ${t}`, live: 'เวลาจริง',
    claudeHelp: 'ใน Claude ไปที่ Settings → Connectors → Add custom connector แล้วใส่ URL นี้',
    claudeEx: 'จากนั้นถามได้เลย เช่น “ตอนนี้ Starlink ดวงไหนอยู่เหนือกรุงเทพฯ กำลังไปทางไหน”',
    copy: 'คัดลอก URL', copied: 'คัดลอกแล้ว', copyFail: 'คัดลอกไม่ได้ ให้เลือกข้อความเอง', globeFail: 'โหลดแผนที่โลกไม่สำเร็จ',
    noWebgl: 'เบราว์เซอร์นี้แสดงลูกโลก 3 มิติไม่ได้ (ไม่รองรับ WebGL)',
  },
  en: {
    brand: 'Satellite Tracker', systems: 'Constellations', legend: 'Showing', useClaude: 'Use with Claude',
    searchPh: 'Search name or NORAD ID', slower: 'Slower / rewind', faster: 'Faster', pause: 'Pause / play', now: 'Back to now',
    total: n => `${n} satellites`, none: 'Turn on a constellation from the “Constellations” menu', loading: 'Loading…',
    loadFail: (g, e) => `Could not load ${g}: ${e}`, notFound: 'Not found in the constellations shown. Turn on more in “Constellations”.',
    heading: d => `Heading ${d}`, north: 'moving north', south: 'moving south',
    lat: 'Latitude', lon: 'Longitude', alt: 'Altitude', speed: 'Speed', period: 'Orbit period', age: 'Orbit data age',
    km: 'km', kms: 'km/s', min: 'min', hr: 'h', days: 'days',
    track: 'Track', tracking: 'Tracking', passes: 'Passes over me', close: 'Close',
    propFail: 'Position can’t be computed; the orbit data may be too old.',
    askLoc: 'Asking for your location…', locFail: 'No location received. Allow location access in your browser and try again.',
    geo: 'This satellite is geostationary: it stays at one point in your sky, so it has no passes.',
    passStart: 'Rises', passMax: 'Max', passDir: 'From → to',
    passNote: 'Next 48 h, at least 10° above the horizon (naked-eye visibility not checked).',
    noPass: 'No passes above 10° over your location in the next 48 hours.',
    paused: 'Paused', updated: t => `Updated ${t}`, live: 'Live',
    claudeHelp: 'In Claude, open Settings → Connectors → Add custom connector and paste this URL.',
    claudeEx: 'Then just ask, for example: “Which Starlink satellites are over Bangkok right now, and which way are they moving?”',
    copy: 'Copy URL', copied: 'Copied', copyFail: 'Copy failed — select the text manually', globeFail: 'Could not load the world map',
    noWebgl: 'This browser can’t show the 3D globe (WebGL not supported).',
  },
};
const EN_NAMES = { stations: 'Space stations', weather: 'Weather', geo: 'Geostationary', amateur: 'Amateur radio' };
const COMPASS_EN = { N: 'north', NE: 'northeast', E: 'east', SE: 'southeast', S: 'south', SW: 'southwest', W: 'west', NW: 'northwest' };

let lang = 'th';
try { const saved = localStorage.getItem('lang'); if (saved === 'en' || saved === 'th') lang = saved; } catch {}
const t = (k, ...a) => { const v = I18N[lang][k]; return typeof v === 'function' ? v(...a) : v; };
const gName = g => lang === 'en' ? (EN_NAMES[g.id] || g.name) : g.name;
const dirText = deg => lang === 'en' ? COMPASS_EN[compassEn(deg)] : compassTh(deg);
const locale = () => lang === 'en' ? 'en-GB' : 'th-TH';

function applyLang() {
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-placeholder]').forEach(el => { el.placeholder = t(el.dataset.i18nPlaceholder); });
  document.querySelectorAll('[data-i18n-title]').forEach(el => { el.title = t(el.dataset.i18nTitle); el.setAttribute('aria-label', t(el.dataset.i18nTitle)); });
  document.querySelectorAll('.lang button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === lang)));
  renderGroups(); renderInfo(); renderClock();
}
document.querySelectorAll('.lang button').forEach(b => b.addEventListener('click', () => {
  lang = b.dataset.lang;
  try { localStorage.setItem('lang', lang); } catch {}
  applyLang();
}));

// ---------------- สถานะ ----------------
const state = Object.fromEntries(GROUPS.map(g => [g.id, { ...g, records: null, pos: [], loading: false, points: null }]));
const SPEEDS = [-3600, -600, -60, -10, 1, 10, 60, 600, 3600];
let simMs = Date.now(), speedIdx = 4, paused = false;
let selected = null;   // { gid, i }
let following = false;
let observer = null, passesHtml = null;
const simTime = () => new Date(simMs);

// ---------------- ลูกโลก 3 มิติ ----------------
const container = $('globe');
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true });
} catch {
  container.innerHTML = `<p style="padding:80px 20px;text-align:center">${t('noWebgl')}</p>`;
  throw new Error('no webgl');
}
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
container.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, 1, 0.01, 100);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.enablePan = false; controls.minDistance = 1.25; controls.maxDistance = 30;
controls.rotateSpeed = 0.5; controls.zoomSpeed = 0.8;

// lat/lon/alt → ตำแหน่ง 3 มิติ (รัศมีโลก = 1)
const RE = 6371;
function toXYZ(lat, lon, altKm, out, k = 0) {
  const r = 1 + altKm / RE, la = lat * Math.PI / 180, lo = lon * Math.PI / 180;
  out[k] = r * Math.cos(la) * Math.cos(lo);
  out[k + 1] = r * Math.sin(la);
  out[k + 2] = -r * Math.cos(la) * Math.sin(lo);
  return out;
}
function setCameraOver(lat, lon, dist) {
  const v = toXYZ(lat, lon, 0, [0, 0, 0]);
  camera.position.set(v[0] * dist, v[1] * dist, v[2] * dist);
  camera.lookAt(0, 0, 0);
}
setCameraOver(15, 100, window.innerWidth < window.innerHeight ? 3.2 / Math.pow(window.innerWidth / window.innerHeight, 0.8) : 3.2);

function drawGeo(geom, fill) {
  const P = ([lon, lat]) => [(lon + 180) / 360 * 4096, (90 - lat) / 180 * 2048];
  const rings = [];
  const add = g => {
    if (g.type === 'Polygon') rings.push(g.coordinates);
    else if (g.type === 'MultiPolygon') g.coordinates.forEach(p => rings.push(p));
    else if (g.type === 'MultiLineString') g.coordinates.forEach(l => rings.push([l]));
    else if (g.type === 'LineString') rings.push([g.coordinates]);
  };
  if (geom.type === 'FeatureCollection') geom.features.forEach(f => add(f.geometry)); else if (geom.type === 'Feature') add(geom.geometry); else add(geom);
  tctx.beginPath();
  for (const poly of rings) for (const ring of poly) {
    let prev = null;
    ring.forEach((c, i) => {
      const [x, y] = P(c);
      // เส้นที่ข้ามเส้นแบ่งวันสากล: ยกปากกาขึ้นแทนการลากเส้นยาวข้ามแผนที่
      if (i === 0) tctx.moveTo(x, y);
      else if (prev && Math.abs(c[0] - prev[0]) > 180) {
        if (fill && c[1] < -60) {
          // แอนตาร์กติกา: อ้อมไปปิดรูปทางขอบล่าง (ขั้วโลกใต้)
          const [px, py] = P(prev), ex = prev[0] > 0 ? 4096 : 0;
          tctx.lineTo(ex, py); tctx.lineTo(ex, 2048); tctx.lineTo(4096 - ex, 2048); tctx.lineTo(4096 - ex, y); tctx.lineTo(x, y);
        } else tctx.moveTo(x, y);
      } else tctx.lineTo(x, y);
      prev = c;
    });
  }
  if (fill) { tctx.fillStyle = '#1E2C40'; tctx.fill('nonzero'); tctx.strokeStyle = '#3E5576'; tctx.lineWidth = 2; tctx.stroke(); }
  else { tctx.strokeStyle = 'rgba(110,140,180,.45)'; tctx.lineWidth = 1.2; tctx.stroke(); }
}

// ดึงข้อมูลวงโคจร: ลองผ่านเซิร์ฟเวอร์ของเราก่อน (api/tle) ถ้าไม่มี (เช่น เปิดบน GitHub Pages
// หรือ api ยังไม่ถูก deploy) จะดึงจาก CelesTrak โดยตรง และเก็บแคชไว้ในเบราว์เซอร์ 2 ชั่วโมง
const CACHE_MS = 2 * 60 * 60 * 1000;
async function fetchRows(id) {
  try {
    const res = await fetch(`api/tle?group=${encodeURIComponent(id)}`);
    if (res.ok) { const body = await res.json(); if (Array.isArray(body.rows)) return body.rows; }
  } catch {}
  const key = `omm:${id}`;
  try {
    const hit = JSON.parse(localStorage.getItem(key) || 'null');
    if (hit && Date.now() - hit.at < CACHE_MS) return hit.rows;
  } catch {}
  const res = await fetch(`https://celestrak.org/NORAD/elements/gp.php?GROUP=${encodeURIComponent(id)}&FORMAT=json`);
  if (!res.ok) throw new Error(`CelesTrak HTTP ${res.status}`);
  const text = await res.text();
  if (!text.trim().startsWith('[')) throw new Error(text.slice(0, 80));
  const rows = packOMM(JSON.parse(text));
  try { localStorage.setItem(key, JSON.stringify({ at: Date.now(), rows })); } catch {}
  return rows;
}

async function loadGroup(g) {
  if (g.records || g.loading) return;
  g.loading = true; renderGroups();
  try {
    const rows = await fetchRows(g.id);
    g.records = rows.map(r => makeRecord(S, unpackRow(r))).filter(Boolean);
    makePoints(g);
    computeGroup(g, simTime());
  } catch (err) {
    g.on = false;
    setStatus(t('loadFail', gName(g), err.message));
  } finally { g.loading = false; renderGroups(); }
}

function computeGroup(g, when) {
  const arr = g.points.geometry.attributes.position.array;
  g.pos.length = g.records.length;
  for (let i = 0; i < g.records.length; i++) {
    const p = positionAt(S, g.records[i], when);
    g.pos[i] = p;
    if (p) toXYZ(p.lat, p.lon, p.alt, arr, i * 3); else arr[i * 3] = arr[i * 3 + 1] = arr[i * 3 + 2] = 0;
  }
  g.points.geometry.attributes.position.needsUpdate = true;
  g.points.visible = g.on;
}

function updateAll() {
  const when = simTime();
  for (const g of Object.values(state)) {
    if (g.points) g.points.visible = g.on;
    if (g.on && g.records) computeGroup(g, when);
  }
  if (selected) {
    const p = state[selected.gid].pos[selected.i];
    ring.visible = !!p;
    if (p) { const v = toXYZ(p.lat, p.lon, p.alt, [0, 0, 0]); ring.position.set(v[0], v[1], v[2]); }
    const r = state[selected.gid].records[selected.i];
    if (Math.abs(simMs - orbitAt) > Math.max(30000, r.periodMin * 60000 / 40)) drawOrbit();
    renderInfoLive();
  }
  renderClock();
}

function drawOrbit() {
  if (!selected) { orbitLine.visible = false; return; }
  const r = state[selected.gid].records[selected.i];
  const per = Math.min(r.periodMin, 1440), step = Math.max(per / 240, 0.25);
  const pts = groundTrack(S, r, new Date(simMs - per * 0.5 * 60000), per, step);
  const arr = new Float32Array(pts.length * 3);
  pts.forEach((p, k) => toXYZ(p.lat, p.lon, p.alt, arr, k * 3));
  orbitLine.geometry.dispose();
  orbitLine.geometry = new THREE.BufferGeometry();
  orbitLine.geometry.setAttribute('position', new THREE.BufferAttribute(arr, 3));
  orbitLine.material.color.set(state[selected.gid].color).lerp(new THREE.Color('#ffffff'), .45);
  orbitLine.visible = true;
  orbitAt = simMs;
}

const tmpV = new THREE.Vector3();
function visibleFromCamera(x, y, z) {
  // ดาวเทียมถูกโลกบังหรือไม่
  const C = camera.position, dx = x - C.x, dy = y - C.y, dz = z - C.z;
  const L = Math.hypot(dx, dy, dz), ux = dx / L, uy = dy / L, uz = dz / L;
  const b = C.x * ux + C.y * uy + C.z * uz, c = C.lengthSq() - 1, disc = b * b - c;
  if (disc < 0) return true;
  const t1 = -b - Math.sqrt(disc);
  return t1 < 0 || t1 > L;
}
function pick(clientX, clientY, maxPx) {
  const rect = renderer.domElement.getBoundingClientRect(), W = rect.width, H = rect.height;
  const mx = clientX - rect.left, my = clientY - rect.top;
  let best = null, bd = maxPx * maxPx;
  for (const g of Object.values(state)) {
    if (!g.on || !g.records) continue;
    const arr = g.points.geometry.attributes.position.array;
    for (let i = 0; i < g.records.length; i++) {
      const x = arr[i * 3], y = arr[i * 3 + 1], z = arr[i * 3 + 2];
      if (x === 0 && y === 0 && z === 0) continue;
      tmpV.set(x, y, z).project(camera);
      if (tmpV.z > 1) continue;
      const sx = (tmpV.x + 1) / 2 * W, sy = (1 - tmpV.y) / 2 * H;
      const d = (sx - mx) ** 2 + (sy - my) ** 2;
      if (d < bd && visibleFromCamera(x, y, z)) { bd = d; best = { gid: g.id, i }; }
    }
  }
  return best;
}

let down = null;
renderer.domElement.addEventListener('pointerdown', e => { down = { x: e.clientX, y: e.clientY, moved: false, type: e.pointerType }; });
renderer.domElement.addEventListener('pointermove', e => {
  if (down && Math.hypot(e.clientX - down.x, e.clientY - down.y) > 6) {
    down.moved = true;
    if (following) { following = false; renderInfo(); }   // ลากลูกโลกเอง = เลิกติดตาม
  }
  if (!down && e.pointerType === 'mouse') hover(e);
});
renderer.domElement.addEventListener('pointerup', e => {
  if (down && !down.moved) {
    const hit = pick(e.clientX, e.clientY, down.type === 'touch' ? 22 : 12);
    if (hit) select(hit, true);
  }
  down = null;
});
renderer.domElement.addEventListener('pointerleave', () => { $('tip').style.display = 'none'; });

let hoverRaf = 0;
function hover(e) {
  if (hoverRaf) return;
  hoverRaf = requestAnimationFrame(() => {
    hoverRaf = 0;
    const hit = pick(e.clientX, e.clientY, 10), tip = $('tip');
    renderer.domElement.style.cursor = hit ? 'pointer' : '';
    if (!hit) { tip.style.display = 'none'; return; }
    tip.textContent = state[hit.gid].records[hit.i].name;
    tip.style.left = e.clientX + 'px'; tip.style.top = e.clientY + 'px'; tip.style.display = 'block';
  });
}

function findPasses() {
  const out = $('passes');

    const r = state[selected.gid].records[selected.i];

    else {

          ? `<table class="num"><thead><tr><th>${t('passStart')}</th><th>${t('passMax')}</th><th>${t('passDir')}</th></tr></thead><tbody>${
              ps.map(p => `<tr><td>${f(p.rise)}</td><td>${p.maxElevation.toFixed(0)}°</td><td>${dirText(p.riseAz)} → ${dirText(p.setAz)}</td></tr>`).join('')
            }</tbody></table><p class="note">${t('passNote')}</p>`
          : `<p class="note">${t('noPass')}</p>`;
      };
    }
    out.innerHTML = passesHtml();
  };
  if (observer) return run();
  out.innerHTML = `<p class="note">${t('askLoc')}</p>`;
  navigator.geolocation.getCurrentPosition(pos => {

    const v = toXYZ(observer.lat, observer.lon, 0, [0, 0, 0]); observerDot.position.set(v[0], v[1], v[2]);

$('mcp-url').textContent = new URL('mcp', location.href).href;
$('claude-btn').onclick = $('claude-btn2').onclick = () => $('claude-dlg').showModal();
$('dlg-close').onclick = () => $('claude-dlg').close();
$('copy').onclick = async () => {
  try { await navigator.clipboard.writeText(new URL('mcp', location.href).href); $('copy').textContent = t('copied'); }
  catch { $('copy').textContent = t('copyFail'); }
};

// ---------------- loop ----------------
let lastFrame = performance.now(), lastUpdate = 0;
const camDir = new THREE.Vector3();
function frame(now) {
  const dt = now - lastFrame; lastFrame = now;
  if (!paused) simMs += dt * SPEEDS[speedIdx];
  const interval = (!paused && SPEEDS[speedIdx] !== 1) ? 200 : 1000;
  if (now - lastUpdate > interval) { lastUpdate = now; updateAll(); }
  if (following && selected && ring.visible) {
    // หมุนกล้องตามดาวเทียมที่เลือก (คงระยะซูมเดิม)
    const dist = camera.position.length();
    camDir.copy(ring.position).normalize().multiplyScalar(dist);
    camera.position.lerp(camDir, 1 - Math.exp(-dt / 180));
    camera.position.setLength(dist);
  }
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

applyLang();
GROUPS.filter(g => g.on).forEach(g => loadGroup(state[g.id]));
setInterval(() => setStatus(t('updated', new Date().toLocaleTimeString(locale()))), 5000);
requestAnimationFrame(frame);
</script>
</body>
