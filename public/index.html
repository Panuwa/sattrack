<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Satellite Tracker · ติดตามดาวเทียม</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛰️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
} }
</script>
<style>
  :root {
    --bg: #05080F;
    --bar: rgba(13, 19, 32, .92);
    --panel: rgba(17, 25, 41, .94);
    --line: #26324A;
    --text: #E4EAF3;
    --text-2: #8C9AB3;
    --accent: #4DA3FF;
    font-family: "IBM Plex Sans Thai", "Noto Sans Thai", system-ui, sans-serif;
    color: var(--text);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
  #globe { position: fixed; inset: 0; }
  #globe canvas { display: block; touch-action: none; }
  #globe canvas.map2d { position: absolute; inset: 0; display: none; cursor: grab; }
  #globe canvas.map2d.dragging { cursor: grabbing; }
  .num { font-variant-numeric: tabular-nums; }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* แถบบน */
  header {
    position: fixed; top: 0; left: 0; right: 0; height: calc(52px + env(safe-area-inset-top));
    padding: env(safe-area-inset-top) 12px 0; display: flex; align-items: center; gap: 10px;
    background: var(--bar); border-bottom: 1px solid var(--line); z-index: 20; backdrop-filter: blur(6px);
  }
  .brand { font-weight: 600; font-size: 1rem; white-space: nowrap; margin-right: auto; display: flex; align-items: center; gap: 8px; }
  .nav-btn {
    background: none; border: 1px solid transparent; border-radius: 6px; padding: 6px 10px; color: var(--text-2); font-size: .9rem; white-space: nowrap;
  }
  .nav-btn:hover, .nav-btn[aria-expanded=true] { color: var(--text); border-color: var(--line); }
  .search-wrap { position: relative; }
  #search {
    width: 230px; background: #0B1220; border: 1px solid var(--line); border-radius: 18px; padding: 6px 14px; font-size: .88rem;
  }
  #results {
    position: absolute; right: 0; top: 40px; width: 320px; max-height: 60vh; overflow-y: auto; list-style: none; margin: 0; padding: 4px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px; display: none;
  }
  #results.open { display: block; }
  #results button { width: 100%; text-align: left; background: none; border: 0; border-radius: 5px; padding: 7px 8px; font-size: .88rem; display: flex; gap: 8px; align-items: center; }
  #results button:hover, #results button:focus-visible { background: #1B2740; }
  #results .sub { color: var(--text-2); font-size: .78rem; margin-left: auto; }
  .lang { display: flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .lang button { background: none; border: 0; padding: 5px 9px; font-size: .8rem; color: var(--text-2); }
  .lang button[aria-pressed=true] { background: var(--accent); color: #fff; }

  /* เมนูระบบดาวเทียม */
  #drawer {
    position: fixed; top: calc(60px + env(safe-area-inset-top)); left: 12px; width: 290px; max-height: calc(100dvh - 140px); overflow-y: auto;
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; z-index: 15; display: none;
  }
  #drawer.open { display: block; }
  .panel-title { font-weight: 600; font-size: .95rem; margin: 0 0 8px; }
  .groups { list-style: none; margin: 0; padding: 0; }
  .groups label { display: grid; grid-template-columns: 16px 12px 1fr auto; gap: 9px; align-items: center; padding: 6px 2px; cursor: pointer; font-size: .9rem; }
  .groups input { margin: 0; accent-color: var(--accent); }
  .sw { width: 12px; height: 12px; border-radius: 3px; }
  .count { color: var(--text-2); font-size: .78rem; }

  /* คำอธิบายสี (ขวาล่าง) */
  #legend {
    position: fixed; right: 12px; bottom: calc(66px + env(safe-area-inset-bottom)); width: 220px; background: var(--panel);
    border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; z-index: 10; font-size: .84rem;
  }
  #legend ul { list-style: none; margin: 0; padding: 0; }
  #legend li { display: flex; align-items: center; gap: 9px; padding: 4px 0; }
  #legend li .count { margin-left: auto; }
  #legend .total { border-top: 1px solid var(--line); margin-top: 8px; padding-top: 8px; color: var(--text-2); font-size: .78rem; }

  /* ข้อมูลดาวเทียมที่เลือก */
  .info-head { display: flex; align-items: flex-start; gap: 8px; }
  .info-name { font-weight: 600; font-size: 1.05rem; line-height: 1.3; }
  .info-sub { color: var(--text-2); font-size: .8rem; margin-top: 2px; }
  .x { margin-left: auto; background: none; border: 0; color: var(--text-2); font-size: 1.2rem; line-height: 1; padding: 2px 4px; }
  .heading { display: flex; align-items: center; gap: 12px; margin: 12px 0 4px; }
  .arrow { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); display: grid; place-items: center; flex: none; }
  .arrow svg { transition: transform .4s; }
  dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; margin: 10px 0 0; font-size: .86rem; }
  dt { color: var(--text-2); }
  dd { margin: 0; text-align: right; }
  .actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .btn { background: #1B2740; border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px; font-size: .85rem; }
  .btn:hover { border-color: var(--text-2); }
  .btn.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  table { width: 100%; border-collapse: collapse; font-size: .8rem; margin-top: 10px; }
  th, td { text-align: left; padding: 5px 3px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--text-2); font-weight: 500; }
  .note { color: var(--text-2); font-size: .78rem; margin: 8px 0 0; line-height: 1.5; }


  /* คอลัมน์ซ้าย: ข้อมูลดาวเทียม + จุดสังเกต */
  #left { position: fixed; top: calc(60px + env(safe-area-inset-top)); left: 12px; width: 320px; max-height: calc(100dvh - 130px);
    overflow-y: auto; display: flex; flex-direction: column; gap: 10px; z-index: 12; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; }
  .card[hidden] { display: none; }
  /* รายการที่เลือก (ขวาบน) */
  #selector { position: fixed; top: calc(60px + env(safe-area-inset-top)); right: 12px; width: 260px; z-index: 12;
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: none; }
  #selector.open { display: block; }
  #sel-list { list-style: none; margin: 6px 0 0; padding: 0; max-height: 34vh; overflow-y: auto; }
  #sel-list li { display: flex; align-items: center; gap: 7px; padding: 4px 0; font-size: .84rem; }
  #sel-list li.focus .sel-name { color: #fff; font-weight: 600; }
  .sel-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-2); background: none; border: 0; text-align: left; padding: 0; font-size: .84rem; }
  .mini { background: none; border: 0; color: var(--text-2); padding: 2px 4px; font-size: .8rem; }
  .mini:hover { color: var(--text); }
  .sel-foot { display: flex; align-items: center; gap: 8px; border-top: 1px solid var(--line); margin-top: 6px; padding-top: 8px; font-size: .8rem; color: var(--text-2); }
  .sel-foot select { background: #0B1220; border: 1px solid var(--line); border-radius: 5px; padding: 2px 4px; font-size: .8rem; }
  .sel-foot .mini { margin-left: auto; }
  /* ป้ายชื่อบนลูกโลก */
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 5; overflow: hidden; }
  #labels div { position: absolute; transform: translate(-50%, 10px); font-size: .72rem; line-height: 1.15; text-align: center;
    color: #fff; text-shadow: 0 0 3px #000, 0 0 6px #000; white-space: nowrap; }
  #labels div small { display: block; color: #B9C6DA; font-size: .66rem; }
  /* จุดสังเกต */
  .obs-inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 8px; }
  .obs-inputs input { width: 100%; background: #0B1220; border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; font-size: .84rem; }
  .obs-inputs label { font-size: .74rem; color: var(--text-2); display: block; margin-bottom: 2px; }
  tr.below td { color: #5E6B82; }
  td button.linkish { background: none; border: 0; padding: 0; color: var(--text); text-align: left; font-size: .8rem; }
  td button.linkish:hover { color: var(--accent); }

  /* แถบเวลาด้านล่าง */
  footer {
    position: fixed; left: 0; right: 0; bottom: 0; height: calc(54px + env(safe-area-inset-bottom)); padding: 0 12px env(safe-area-inset-bottom);
    background: var(--bar); border-top: 1px solid var(--line); display: flex; align-items: center; gap: 14px; z-index: 20; backdrop-filter: blur(6px);
  }
  .clock { display: flex; flex-direction: column; line-height: 1.2; }
  .clock .t { font-size: 1.05rem; font-weight: 500; }
  .clock .d { font-size: .74rem; color: var(--text-2); }
  .tc { display: flex; gap: 4px; margin-left: auto; align-items: center; }
  .tc button { width: 36px; height: 34px; background: #1B2740; border: 1px solid var(--line); border-radius: 6px; display: grid; place-items: center; }
  .tc button:hover { border-color: var(--text-2); }
  .speed { min-width: 64px; text-align: center; font-size: .82rem; color: var(--text-2); }
  .status { font-size: .74rem; color: var(--text-2); }

  #tip { position: fixed; pointer-events: none; background: #0B1220; border: 1px solid var(--line); color: var(--text); font-size: .78rem; padding: 3px 8px; border-radius: 4px; transform: translate(12px, -130%); display: none; z-index: 30; white-space: nowrap; }

  /* หน้าต่างเชื่อม Claude */
  dialog { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 12px; max-width: 440px; padding: 20px; }
  dialog::backdrop { background: rgba(0,0,0,.6); }
  dialog code { display: block; background: #0B1220; border: 1px solid var(--line); border-radius: 6px; padding: 9px; font-size: .82rem; word-break: break-all; margin: 10px 0; }
  dialog p { font-size: .88rem; line-height: 1.6; color: var(--text-2); margin: 6px 0; }

  @media (max-width: 760px) {
    header { gap: 6px; padding-left: 8px; padding-right: 8px; }
    .brand { margin-right: 0; }
    .brand span, #claude-btn { display: none; }
    .nav-btn { padding: 6px 6px; }
    .search-wrap { flex: 1; min-width: 0; }
    #search { width: 100%; }
    #results { width: calc(100vw - 16px); right: auto; left: 50%; transform: translateX(-50%); position: fixed; top: calc(56px + env(safe-area-inset-top)); }
    #legend { display: none; }
    #left { left: 8px; right: 8px; width: auto; top: auto; bottom: calc(62px + env(safe-area-inset-bottom)); max-height: 44dvh; }
    #selector { right: 8px; width: 200px; }
    #sel-list { max-height: 18vh; }
    #drawer { left: 8px; right: 8px; width: auto; }
    .clock .d { display: none; }
    .status { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { .arrow svg { transition: none; } }
</style>
</head>
<body>
<div id="globe"></div>

<header>
  <div class="brand">🛰️ <span data-i18n="brand"></span></div>
  <button class="nav-btn" id="groups-btn" aria-expanded="false" aria-controls="drawer" data-i18n="systems"></button>
  <button class="nav-btn" id="view-btn"></button>
  <button class="nav-btn" id="obs-btn" aria-expanded="false" data-i18n="observer"></button>
  <button class="nav-btn" id="claude-btn" data-i18n="useClaude"></button>
  <div class="search-wrap">
    <input type="search" id="search" autocomplete="off" data-i18n-placeholder="searchPh" aria-label="search">
    <ul id="results"></ul>
  </div>
  <div class="lang" role="group" aria-label="Language">
    <button data-lang="th" aria-pressed="true">ไทย</button>
    <button data-lang="en" aria-pressed="false">EN</button>
  </div>
</header>

<section id="drawer" aria-label="systems">
  <p class="panel-title" data-i18n="systems"></p>
  <ul class="groups" id="groups"></ul>
  <button class="btn" id="claude-btn2" style="margin-top:10px;width:100%" data-i18n="useClaude"></button>
</section>

<aside id="legend">
  <p class="panel-title" data-i18n="legend"></p>
  <ul id="legend-list"></ul>
  <div class="total num" id="total"></div>
</aside>

<div id="labels"></div>

<div id="left">
  <section class="card" id="info" hidden></section>
  <section class="card" id="obs" hidden></section>
</div>

<aside id="selector">
  <div style="display:flex;align-items:center"><strong style="font-size:.88rem" id="sel-title"></strong><button class="mini" id="sel-clear" style="margin-left:auto"></button></div>
  <ul id="sel-list"></ul>
  <div class="sel-foot"><label for="minel" data-i18n="covEl"></label>
    <select id="minel"><option value="0">0°</option><option value="10">10°</option><option value="25" selected>25°</option><option value="40">40°</option></select>
  </div>
</aside>

<footer>
  <div class="clock num"><span class="t" id="clock">--:--:--</span><span class="d" id="date"></span></div>
  <span class="status" id="status"></span>
  <div class="tc">
    <button id="slower" data-i18n-title="slower" aria-label="slower"><svg width="16" height="16" viewBox="0 0 16 16"><path d="M8 3v10L1 8zM15 3v10L8 8z" fill="currentColor"/></svg></button>
    <button id="play" data-i18n-title="pause" aria-label="pause"><svg width="16" height="16" viewBox="0 0 16 16" id="play-icon"><path d="M4 2h3v12H4zM9 2h3v12H9z" fill="currentColor"/></svg></button>
    <button id="faster" data-i18n-title="faster" aria-label="faster"><svg width="16" height="16" viewBox="0 0 16 16"><path d="M8 3v10l7-5zM1 3v10l7-5z" fill="currentColor"/></svg></button>
    <span class="speed num" id="speed">×1</span>
    <button id="reset" data-i18n-title="now" aria-label="now"><svg width="16" height="16" viewBox="0 0 16 16"><path d="M13.5 8A5.5 5.5 0 1 1 8 2.5c1.6 0 3 .7 4 1.8V2h1.5v4.8H8.7V5.3h2.4A4 4 0 1 0 12 8z" fill="currentColor"/></svg></button>
  </div>
</footer>

<div id="tip"></div>

<dialog id="claude-dlg">
  <h3 style="margin:0 0 6px" data-i18n="useClaude"></h3>
  <p data-i18n="claudeHelp"></p>
  <code id="mcp-url"></code>
  <p data-i18n="claudeEx"></p>
  <div class="actions"><button class="btn" id="copy" data-i18n="copy"></button><button class="btn" id="dlg-close" data-i18n="close"></button></div>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/satellite.js@6.0.2/dist/satellite.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
<script type="module">

const MAX_SEL = 30;

    const arr = new Float32Array(pts.length * 3);
    pts.forEach((q, k) => toXYZ(q.lat, q.lon, q.alt, arr, k * 3));
    s.orbit.geometry.dispose();
    s.orbit.geometry = new THREE.BufferGeometry();
    s.orbit.geometry.setAttribute('position', new THREE.BufferAttribute(arr, 3));
    s.track = pts;
    s.orbitAt = simMs;
  }
  const short = r.name.replace(/^STARLINK-/, '').replace(/^ONEWEB-/, '');
  const html = `${esc(short)}<small>${Math.round(p.alt)} ${t('km')}</small>`;
  if (s.label.innerHTML !== html) s.label.innerHTML = html;
}

function updateLos() {
  const segs = [];
  if (observer) {
    const o = toVec(observer.lat, observer.lon, 0);
    for (const s of sels) {
      const p = posOf(s); if (!p || !state[s.gid].on) continue;
      if (lookFromPos(S, observer, p).el > 0) { const v = toVec(p.lat, p.lon, p.alt); segs.push(o.x, o.y, o.z, v.x, v.y, v.z); }
    }
  }
  losLines.geometry.dispose();
  losLines.geometry = new THREE.BufferGeometry();
  losLines.geometry.setAttribute('position', new THREE.BufferAttribute(new Float32Array(segs), 3));

const tmpV = new THREE.Vector3();
function visibleFromCamera(x, y, z) {
  const C = camera.position, dx = x - C.x, dy = y - C.y, dz = z - C.z;
  const L = Math.hypot(dx, dy, dz), ux = dx / L, uy = dy / L, uz = dz / L;
  const b = C.x * ux + C.y * uy + C.z * uz, c = C.lengthSq() - 1, disc = b * b - c;
  if (disc < 0) return true;
  const t1 = -b - Math.sqrt(disc);
  return t1 < 0 || t1 > L;
}
function screenOf(v, W, H) { tmpV.copy(v).project(camera); return { x: (tmpV.x + 1) / 2 * W, y: (1 - tmpV.y) / 2 * H, z: tmpV.z }; }
function pick(clientX, clientY, maxPx) {
  const rect = renderer.domElement.getBoundingClientRect(), W = rect.width, H = rect.height;
  const mx = clientX - rect.left, my = clientY - rect.top;
  let best = null, bd = maxPx * maxPx;
  for (const g of Object.values(state)) {
    if (!g.on || !g.records) continue;
    const arr = g.points.geometry.attributes.position.array;
    for (let i = 0; i < g.records.length; i++) {
      const x = arr[i * 3], y = arr[i * 3 + 1], z = arr[i * 3 + 2];
      if (x === 0 && y === 0 && z === 0) continue;
      tmpV.set(x, y, z).project(camera);
      if (tmpV.z > 1) continue;
      const sx = (tmpV.x + 1) / 2 * W, sy = (1 - tmpV.y) / 2 * H;
      const d = (sx - mx) ** 2 + (sy - my) ** 2;
      if (d < bd && visibleFromCamera(x, y, z)) { bd = d; best = { gid: g.id, i }; }
    }
  }
  return best;
}
const raycaster = new THREE.Raycaster();
function pickEarth(clientX, clientY) {
  const rect = renderer.domElement.getBoundingClientRect();
  const ndc = new THREE.Vector2((clientX - rect.left) / rect.width * 2 - 1, -((clientY - rect.top) / rect.height) * 2 + 1);
  raycaster.setFromCamera(ndc, camera);
  const hit = raycaster.intersectObject(earth, false)[0];
  return hit ? fromVec(hit.point) : null;
}

let down = null;
renderer.domElement.addEventListener('pointerdown', e => { down = { x: e.clientX, y: e.clientY, moved: false, type: e.pointerType }; });
renderer.domElement.addEventListener('pointermove', e => {
  if (down && Math.hypot(e.clientX - down.x, e.clientY - down.y) > 6) {
    down.moved = true;
    if (following) { following = false; renderInfo(); }
  }
  if (!down && e.pointerType === 'mouse') hover(e);
});
renderer.domElement.addEventListener('pointerup', e => {
  if (down && !down.moved) {
    const hit = pick(e.clientX, e.clientY, down.type === 'touch' ? 22 : 12);
    if (hit) addSel(hit.gid, hit.i);
    else { const ll = pickEarth(e.clientX, e.clientY); if (ll) setObserver(ll.lat, ll.lon); }
  }
  down = null;
});
renderer.domElement.addEventListener('pointerleave', () => { $('tip').style.display = 'none'; });
let hoverRaf = 0;
function hover(e) {
  if (hoverRaf) return;
  hoverRaf = requestAnimationFrame(() => {
    hoverRaf = 0;
    const hit = pick(e.clientX, e.clientY, 10), tip = $('tip');
    renderer.domElement.style.cursor = hit ? 'pointer' : 'crosshair';
    if (!hit) { tip.style.display = 'none'; return; }
    tip.textContent = state[hit.gid].records[hit.i].name;
    tip.style.left = e.clientX + 'px'; tip.style.top = e.clientY + 'px'; tip.style.display = 'block';
  });
}

function findPasses() {

    else {
      const ps = predictPasses(S, r, observer, simTime(), 48, 10, 8);

}

let topList = [];
function renderObsLive() {
  const live = $('obs-live');
  if (!live || !observer) { if (live) live.innerHTML = ''; return; }
  const row = (name, l, extra = '') => `<tr class="${l.el < 0 ? 'below' : ''}"><td>${name}</td><td title="${dirText(l.az)}">${nf(l.az, 1)}°</td><td>${nf(l.el, 1)}°</td><td>${nf(l.rangeKm, 0)}</td>${extra}</tr>`;

    }</tbody></table><p class="note">${t('belowNote')}</p>`;
  }
  // ดาวเทียมที่อยู่สูงที่สุดจากจุดนี้ (จากทุกระบบที่เปิดอยู่)
  const cand = [];
  const cosMax = Math.cos(80 * Math.PI / 180);
  const ov = toVec(observer.lat, observer.lon, 0).normalize();
  for (const g of Object.values(state)) {
    if (!g.on || !g.records) continue;
    for (let i = 0; i < g.pos.length; i++) {

      if (l.el >= minEl) cand.push({ gid: g.id, i, l });
    }
  }

    : `<p class="note">${t('noneUp')}</p>`;

}

  clampView();
}
window.addEventListener('resize', resizeMap);
mv.s = Math.max(minScale(), window.innerWidth / 360); resizeMap();

const nearShift = lon => 360 * Math.round((mv.lon - lon) / 360);
function unwrapTrack(pts) {
  const out = []; let prev = null, off = 0;
  for (const q of pts) { if (prev !== null) { const d = q.lon - prev; if (d > 180) off -= 360; else if (d < -180) off += 360; } out.push([q.lon + off, q.lat]); prev = q.lon; }
  return out;
}
function draw2d() {
  const { W, H } = vsize(), sc = mv.s;
  const X = lon => W / 2 + (lon - mv.lon) * sc, Yp = lat => H / 2 - (lat - mv.lat) * sc;
  mctx.fillStyle = '#05080F'; mctx.fillRect(0, 0, W, H);
  const left = mv.lon - W / 2 / sc, right = mv.lon + W / 2 / sc;
  // วาดเฉพาะส่วนของแผนที่ที่อยู่ในจอ (เร็วกว่าวาดทั้งภาพ)
  const top = Math.min(90, mv.lat + H / 2 / sc), bot = Math.max(-90, mv.lat - H / 2 / sc);
  for (let k = Math.floor((left + 180) / 360); k <= Math.floor((right + 180) / 360); k++) {
    const w0 = -180 + k * 360, a = Math.max(left, w0), b = Math.min(right, w0 + 360);
    if (b <= a || top <= bot) continue;
    const sx = (a - w0) / 360 * 4096, sw = (b - a) / 360 * 4096, sy = (90 - top) / 180 * 2048, sh = (top - bot) / 180 * 2048;
    mctx.drawImage(texCanvas, sx, sy, sw, sh, X(a), Yp(top), (b - a) * sc, (top - bot) * sc);
  }
  const poly = (pts, sh) => { mctx.beginPath(); pts.forEach(([l, la], i) => { const x = X(l + sh), y = Yp(la); i ? mctx.lineTo(x, y) : mctx.moveTo(x, y); }); };
  // พื้นที่ครอบคลุม + วงโคจร (ground track) ของดวงที่เลือก
  for (const s of sels) {
    if (!s.p || !state[s.gid].on) continue;
    const base = nearShift(s.p.lon);
    if (s.foot) for (const d of [-360, 0, 360]) {
      poly(s.foot, base + d); mctx.closePath();
      mctx.fillStyle = `rgba(77,163,255,${Math.min(0.24, Math.max(0.05, 0.24 * 15 / Math.max(s.ang || 1, 1)))})`; mctx.fill();
      mctx.strokeStyle = 'rgba(140,196,255,.8)'; mctx.lineWidth = 1; mctx.stroke();
    }
    if (s.track) {
      const u = unwrapTrack(s.track);
      mctx.strokeStyle = new THREE.Color(state[s.gid].color).lerp(new THREE.Color('#ffffff'), .35).getStyle();
      mctx.lineWidth = s.key === focusKey ? 1.8 : 1.2;
      for (const d of [-360, 0, 360]) { poly(u, nearShift(u[0][0]) + d); mctx.stroke(); }
    }
  }
  // จุดดาวเทียม
  hits2d = [];
  for (const g of Object.values(state)) {
    if (!g.on || !g.records) continue;
    mctx.fillStyle = g.color;
    const r = Math.max(1.1, g.size * 0.85), round = r >= 2.2;
    for (let i = 0; i < g.pos.length; i++) {
      const p = g.pos[i]; if (!p) continue;
      const y = Yp(p.lat); if (y < -5 || y > H + 5) continue;
      const lw = p.lon + nearShift(p.lon);
      for (const d of [-360, 0, 360]) {
        const x = X(lw + d); if (x < -5 || x > W + 5) continue;
        if (round) { mctx.beginPath(); mctx.arc(x, y, r, 0, 6.2832); mctx.fill(); } else mctx.fillRect(x - r, y - r, r * 2, r * 2);
        hits2d.push(x, y, g.id, i);
      }
    }
  }
  // วงแหวน + ป้ายชื่อ
  mctx.font = '12px "IBM Plex Sans Thai", system-ui, sans-serif'; mctx.textAlign = 'center';
  for (const s of sels) {
    if (!s.p || !state[s.gid].on) continue;
    const y = Yp(s.p.lat), lw = s.p.lon + nearShift(s.p.lon);
    for (const d of [-360, 0, 360]) {
      const x = X(lw + d); if (x < -60 || x > W + 60) continue;
      mctx.strokeStyle = s.key === focusKey ? '#ffffff' : new THREE.Color(state[s.gid].color).lerp(new THREE.Color('#ffffff'), .35).getStyle();
      mctx.lineWidth = 2; mctx.beginPath(); mctx.arc(x, y, s.key === focusKey ? 9 : 7, 0, 6.2832); mctx.stroke();
      const name = recOf(s).name.replace(/^STARLINK-/, '').replace(/^ONEWEB-/, '');
      mctx.lineWidth = 3; mctx.strokeStyle = 'rgba(0,0,0,.85)'; mctx.fillStyle = '#fff';
      mctx.strokeText(name, x, y + 22); mctx.fillText(name, x, y + 22);
      mctx.font = '10px "IBM Plex Sans Thai", system-ui, sans-serif'; mctx.fillStyle = '#B9C6DA';
      const alt = `${Math.round(s.p.alt)} ${t('km')}`; mctx.strokeText(alt, x, y + 34); mctx.fillText(alt, x, y + 34);
      mctx.font = '12px "IBM Plex Sans Thai", system-ui, sans-serif';
    }
  }
  // จุดสังเกต
  if (observer) {
    const y = Yp(observer.lat), lw = observer.lon + nearShift(observer.lon);
    for (const d of [-360, 0, 360]) {
      const x = X(lw + d); if (x < -10 || x > W + 10) continue;
      mctx.fillStyle = '#FFD43B'; mctx.strokeStyle = '#000'; mctx.lineWidth = 1.5;
      mctx.beginPath(); mctx.arc(x, y, 5, 0, 6.2832); mctx.fill(); mctx.stroke();
    }
  }
}
function pick2d(cx, cy, maxPx) {
  let best = null, bd = maxPx * maxPx;
  for (let k = 0; k < hits2d.length; k += 4) {
    const d = (hits2d[k] - cx) ** 2 + (hits2d[k + 1] - cy) ** 2;
    if (d < bd) { bd = d; best = { gid: hits2d[k + 2], i: hits2d[k + 3] }; }
  }
  return best;
}
function lonLatAt(cx, cy) {
  const { W, H } = vsize();
  const lat = mv.lat - (cy - H / 2) / mv.s, lon = mv.lon + (cx - W / 2) / mv.s;
  if (lat < -90 || lat > 90) return null;
  return { lat, lon: ((lon + 540) % 360 + 360) % 360 - 180 };
}
function zoomAt(cx, cy, factor) {
  const { W, H } = vsize();
  const lon0 = mv.lon + (cx - W / 2) / mv.s, lat0 = mv.lat - (cy - H / 2) / mv.s;
  mv.s *= factor; clampView();
  mv.lon = lon0 - (cx - W / 2) / mv.s; mv.lat = lat0 + (cy - H / 2) / mv.s; clampView();
}
// ลาก / ซูม / คลิก บนแผนที่
const ptrs = new Map(); let mdown = null, pinch = null;
mapCanvas.addEventListener('pointerdown', e => {
  mapCanvas.setPointerCapture(e.pointerId);
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (ptrs.size === 1) mdown = { x: e.clientX, y: e.clientY, moved: false, type: e.pointerType };
  if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; pinch = Math.hypot(a.x - b.x, a.y - b.y); if (mdown) mdown.moved = true; }
});
mapCanvas.addEventListener('pointermove', e => {
  const prev = ptrs.get(e.pointerId);
  if (!prev) { if (e.pointerType === 'mouse') hover2d(e); return; }
  const cur = { x: e.clientX, y: e.clientY };
  ptrs.set(e.pointerId, cur);
  if (ptrs.size === 2 && pinch) {
    const [a, b] = [...ptrs.values()], d = Math.hypot(a.x - b.x, a.y - b.y);
    zoomAt((a.x + b.x) / 2, (a.y + b.y) / 2, d / pinch); pinch = d; return;
  }
  if (mdown && Math.hypot(cur.x - mdown.x, cur.y - mdown.y) > 6 && !mdown.moved) {
    mdown.moved = true; mapCanvas.classList.add('dragging');
    if (following) { following = false; renderInfo(); }
  }
  if (mdown && mdown.moved) { mv.lon -= (cur.x - prev.x) / mv.s; mv.lat += (cur.y - prev.y) / mv.s; clampView(); }
});
function endPtr(e) {
  ptrs.delete(e.pointerId);
  if (ptrs.size < 2) pinch = null;
  if (ptrs.size === 0) {
    if (mdown && !mdown.moved && e.type === 'pointerup') {
      const rect = mapCanvas.getBoundingClientRect(), cx = e.clientX - rect.left, cy = e.clientY - rect.top;
      const hit = pick2d(cx, cy, mdown.type === 'touch' ? 22 : 12);
      if (hit) addSel(hit.gid, hit.i);
      else { const ll = lonLatAt(cx, cy); if (ll) setObserver(ll.lat, ll.lon); }
    }
    mdown = null; mapCanvas.classList.remove('dragging');
  }
}
mapCanvas.addEventListener('pointerup', endPtr);
mapCanvas.addEventListener('pointercancel', endPtr);
mapCanvas.addEventListener('pointerleave', () => { $('tip').style.display = 'none'; });
mapCanvas.addEventListener('wheel', e => {
  e.preventDefault();
  const rect = mapCanvas.getBoundingClientRect();
  zoomAt(e.clientX - rect.left, e.clientY - rect.top, Math.exp(-e.deltaY * 0.0015));
}, { passive: false });
let hover2dRaf = 0;
function hover2d(e) {
  if (hover2dRaf) return;
  hover2dRaf = requestAnimationFrame(() => {
    hover2dRaf = 0;
    const rect = mapCanvas.getBoundingClientRect(), hit = pick2d(e.clientX - rect.left, e.clientY - rect.top, 10), tip = $('tip');
    mapCanvas.style.cursor = hit ? 'pointer' : '';
    if (!hit) { tip.style.display = 'none'; return; }
    tip.textContent = state[hit.gid].records[hit.i].name;
    tip.style.left = e.clientX + 'px'; tip.style.top = e.clientY + 'px'; tip.style.display = 'block';
  });
}
function follow2d(dt) {
  const f = focusSel();
  if (!following || !f || !f.p) return;
  const k = 1 - Math.exp(-dt / 180), tl = f.p.lon + nearShift(f.p.lon);
  mv.lon += (tl - mv.lon) * k; mv.lat += (f.p.lat - mv.lat) * k; clampView();
}
function renderViewBtn() { $('view-btn').textContent = view === '3d' ? t('to2d') : t('to3d'); }
function setView(v) {
  if (v === '2d' && view === '3d') { const ll = fromVec(camera.position); mv.lon = ll.lon; mv.lat = ll.lat; clampView(); }
  if (v === '3d' && view === '2d') camera.position.copy(toVec(mv.lat, mv.lon, 0).multiplyScalar(camera.position.length()));
  view = v;
  renderer.domElement.style.display = v === '3d' ? 'block' : 'none';
  mapCanvas.style.display = v === '2d' ? 'block' : 'none';
  $('labels').style.display = v === '3d' ? 'block' : 'none';
  $('tip').style.display = 'none';
  try { localStorage.setItem('view', v); } catch {}
  renderViewBtn();
}
$('view-btn').addEventListener('click', () => setView(view === '3d' ? '2d' : '3d'));

// ---------------- loop ----------------
let lastFrame = performance.now(), lastUpdate = 0;
const camDir = new THREE.Vector3();
function placeLabels() {
  const W = window.innerWidth, H = window.innerHeight;
  for (const s of sels) {
    if (!s.ring.visible) { s.label.style.display = 'none'; continue; }
    const p = s.ring.position, sc = screenOf(p, W, H);
    const show = sc.z < 1 && visibleFromCamera(p.x, p.y, p.z) && sc.x > -50 && sc.x < W + 50 && sc.y > -50 && sc.y < H + 50;
    s.label.style.display = show ? 'block' : 'none';
    if (show) s.label.style.left = sc.x + 'px', s.label.style.top = sc.y + 'px';
  }
}
function frame(now) {
  const dt = now - lastFrame; lastFrame = now;
  if (!paused) simMs += dt * SPEEDS[speedIdx];
  const interval = (!paused && SPEEDS[speedIdx] !== 1) ? 200 : 1000;
  if (now - lastUpdate > interval) { lastUpdate = now; updateAll(); }
  if (view === '2d') { follow2d(dt); if (dirty2d) { dirty2d = false; draw2d(); } requestAnimationFrame(frame); return; }
  const f = focusSel();
  if (following && f && f.ring.visible) {
    const dist = camera.position.length();
    camDir.copy(f.ring.position).normalize().multiplyScalar(dist);
    camera.position.lerp(camDir, 1 - Math.exp(-dt / 180));
    camera.position.setLength(dist);
  }
  controls.update();
  renderer.render(scene, camera);
  placeLabels();
  requestAnimationFrame(frame);
}

setView(view);
applyLang();
GROUPS.filter(g => g.on).forEach(g => loadGroup(state[g.id]));
setInterval(() => setStatus(t('updated', new Date().toLocaleTimeString(locale()))), 5000);
requestAnimationFrame(frame);
</script>
