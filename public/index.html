<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Satellite Tracker · ติดตามดาวเทียม</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛰️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
} }
</script>
<style>
  :root {
    --bg: #05080F;
    --bar: rgba(13, 19, 32, .92);
    --panel: rgba(17, 25, 41, .94);
    --line: #26324A;
    --text: #E4EAF3;
    --text-2: #8C9AB3;
    --accent: #4DA3FF;
    font-family: "IBM Plex Sans Thai", "Noto Sans Thai", system-ui, sans-serif;
    color: var(--text);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
  #globe { position: fixed; inset: 0; }
  #globe canvas { display: block; touch-action: none; }
  #globe canvas.map2d { position: absolute; inset: 0; display: none; cursor: grab; }
  #globe canvas.map2d.dragging { cursor: grabbing; }
  .num { font-variant-numeric: tabular-nums; }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* แถบบน */
  header {
    position: fixed; top: 0; left: 0; right: 0; height: calc(52px + env(safe-area-inset-top));
    padding: env(safe-area-inset-top) 12px 0; display: flex; align-items: center; gap: 10px;
    background: var(--bar); border-bottom: 1px solid var(--line); z-index: 20; backdrop-filter: blur(6px);
  }
  .brand { font-weight: 600; font-size: 1rem; white-space: nowrap; margin-right: auto; display: flex; align-items: center; gap: 8px; }
  .nav-btn {
    background: none; border: 1px solid transparent; border-radius: 6px; padding: 6px 10px; color: var(--text-2); font-size: .9rem; white-space: nowrap;
  }
  .nav-btn:hover, .nav-btn[aria-expanded=true] { color: var(--text); border-color: var(--line); }
  .search-wrap { position: relative; }
  #search {
    width: 230px; background: #0B1220; border: 1px solid var(--line); border-radius: 18px; padding: 6px 14px; font-size: .88rem;
  }
  #results {
    position: absolute; right: 0; top: 40px; width: 320px; max-height: 60vh; overflow-y: auto; list-style: none; margin: 0; padding: 4px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px; display: none;
  }
  #results.open { display: block; }
  #results button { width: 100%; text-align: left; background: none; border: 0; border-radius: 5px; padding: 7px 8px; font-size: .88rem; display: flex; gap: 8px; align-items: center; }
  #results button:hover, #results button:focus-visible { background: #1B2740; }
  #results .sub { color: var(--text-2); font-size: .78rem; margin-left: auto; }
  .lang { display: flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .lang button { background: none; border: 0; padding: 5px 9px; font-size: .8rem; color: var(--text-2); }
  .lang button[aria-pressed=true] { background: var(--accent); color: #fff; }

  /* เมนูระบบดาวเทียม */
  #drawer, #vdrawer {
    position: fixed; top: calc(60px + env(safe-area-inset-top)); left: 12px; width: 290px; max-height: calc(100dvh - 140px); overflow-y: auto;
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; z-index: 15; display: none;
  }
  #drawer.open, #vdrawer.open { display: block; }
  .panel-title.sub { font-size: .84rem; color: var(--text-2); margin-top: 12px; }
  .hist-row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-top: 8px; }
  .hist-row select { background: #0B1220; border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; font-size: .85rem; }
  .panel-title { font-weight: 600; font-size: .95rem; margin: 0 0 8px; }
  .groups { list-style: none; margin: 0; padding: 0; }
  .groups label { display: grid; grid-template-columns: 16px 12px 1fr auto; gap: 9px; align-items: center; padding: 6px 2px; cursor: pointer; font-size: .9rem; }
  .groups input { margin: 0; accent-color: var(--accent); }
  .sw { width: 12px; height: 12px; border-radius: 3px; }
  .count { color: var(--text-2); font-size: .78rem; }

  /* คำอธิบายสี (ขวาล่าง) */
  #legend {
    position: fixed; right: 12px; bottom: calc(66px + env(safe-area-inset-bottom)); width: 220px; background: var(--panel);
    border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; z-index: 10; font-size: .84rem;
  }
  #legend ul { list-style: none; margin: 0; padding: 0; }
  #legend li { display: flex; align-items: center; gap: 9px; padding: 4px 0; }
  #legend li .count { margin-left: auto; }
  #legend .total { border-top: 1px solid var(--line); margin-top: 8px; padding-top: 8px; color: var(--text-2); font-size: .78rem; }

  /* ข้อมูลดาวเทียมที่เลือก */
  .info-head { display: flex; align-items: flex-start; gap: 8px; }
  .info-name { font-weight: 600; font-size: 1.05rem; line-height: 1.3; }
  .info-sub { color: var(--text-2); font-size: .8rem; margin-top: 2px; }
  .x { margin-left: auto; background: none; border: 0; color: var(--text-2); font-size: 1.2rem; line-height: 1; padding: 2px 4px; }
  .heading { display: flex; align-items: center; gap: 12px; margin: 12px 0 4px; }
  .arrow { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); display: grid; place-items: center; flex: none; }
  .arrow svg { transition: transform .4s; }
  dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; margin: 10px 0 0; font-size: .86rem; }
  dt { color: var(--text-2); }
  dd { margin: 0; text-align: right; }
  .kv { display: contents; }
  .actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .btn { background: #1B2740; border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px; font-size: .85rem; }
  .btn:hover { border-color: var(--text-2); }
  .btn.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  table { width: 100%; border-collapse: collapse; font-size: .8rem; margin-top: 10px; }
  th, td { text-align: left; padding: 5px 3px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--text-2); font-weight: 500; }
  .note { color: var(--text-2); font-size: .78rem; margin: 8px 0 0; line-height: 1.5; }


  /* คอลัมน์ซ้าย: ข้อมูลดาวเทียม + จุดสังเกต */
  #left { position: fixed; top: calc(60px + env(safe-area-inset-top)); left: 12px; width: 320px; max-height: calc(100dvh - 130px);
    overflow-y: auto; display: flex; flex-direction: column; gap: 10px; z-index: 12; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; }
  .card[hidden] { display: none; }
  /* รายการที่เลือก (ขวาบน) */
  #selector { position: fixed; top: calc(60px + env(safe-area-inset-top)); right: 12px; width: 260px; z-index: 12;
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: none; }
  #selector.open { display: block; }
  #sel-list { list-style: none; margin: 6px 0 0; padding: 0; max-height: 34vh; overflow-y: auto; }
  #sel-list li { display: flex; align-items: center; gap: 7px; padding: 4px 0; font-size: .84rem; }
  #sel-list li.focus .sel-name { color: #fff; font-weight: 600; }
  .sel-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-2); background: none; border: 0; text-align: left; padding: 0; font-size: .84rem; }
  .mini { background: none; border: 0; color: var(--text-2); padding: 2px 4px; font-size: .8rem; }
  .mini:hover { color: var(--text); }
  .sel-foot { display: flex; align-items: center; gap: 8px; border-top: 1px solid var(--line); margin-top: 6px; padding-top: 8px; font-size: .8rem; color: var(--text-2); }
  .sel-foot select { background: #0B1220; border: 1px solid var(--line); border-radius: 5px; padding: 2px 4px; font-size: .8rem; }
  .sel-foot .mini { margin-left: auto; }
  /* ป้ายชื่อบนลูกโลก */
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 5; overflow: hidden; }
  #labels div { position: absolute; transform: translate(-50%, 10px); font-size: .72rem; line-height: 1.15; text-align: center;
    color: #fff; text-shadow: 0 0 3px #000, 0 0 6px #000; white-space: nowrap; }
  #labels div small { display: block; color: #B9C6DA; font-size: .66rem; }
  /* จุดสังเกต */
  .obs-inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 8px; }
  .obs-inputs input { width: 100%; background: #0B1220; border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; font-size: .84rem; }
  .obs-inputs label { font-size: .74rem; color: var(--text-2); display: block; margin-bottom: 2px; }
  tr.below td { color: #5E6B82; }
  td button.linkish { background: none; border: 0; padding: 0; color: var(--text); text-align: left; font-size: .8rem; }
  td button.linkish:hover { color: var(--accent); }

  .ships-box { border-top: 1px solid var(--line); margin-top: 10px; padding-top: 10px; }
  .ship-toggle { display: grid; grid-template-columns: 16px 1fr auto; gap: 9px; align-items: center; padding: 6px 2px; cursor: pointer; font-size: .9rem; }
  .ship-toggle input { margin: 0; accent-color: var(--accent); }
  #ship-legend li { display: flex; align-items: center; gap: 9px; padding: 3px 2px; font-size: .82rem; color: var(--text-2); }
  .card a { color: var(--accent); }
  /* แถบเวลาด้านล่าง */
  footer {
    position: fixed; left: 0; right: 0; bottom: 0; height: calc(54px + env(safe-area-inset-bottom)); padding: 0 12px env(safe-area-inset-bottom);
    background: var(--bar); border-top: 1px solid var(--line); display: flex; align-items: center; gap: 14px; z-index: 20; backdrop-filter: blur(6px);
  }
  .clock { display: flex; flex-direction: column; line-height: 1.2; }
  .clock .t { font-size: 1.05rem; font-weight: 500; }
  .clock .d { font-size: .74rem; color: var(--text-2); }
  .tc { display: flex; gap: 4px; margin-left: auto; align-items: center; }
  .tc button { width: 36px; height: 34px; background: #1B2740; border: 1px solid var(--line); border-radius: 6px; display: grid; place-items: center; }
  .tc button:hover { border-color: var(--text-2); }
  .speed { min-width: 64px; text-align: center; font-size: .82rem; color: var(--text-2); }
  .status { font-size: .74rem; color: var(--text-2); }

  #tip { position: fixed; pointer-events: none; background: #0B1220; border: 1px solid var(--line); color: var(--text); font-size: .78rem; padding: 3px 8px; border-radius: 4px; transform: translate(12px, -130%); display: none; z-index: 30; white-space: nowrap; }

  /* หน้าต่างเชื่อม Claude */
  dialog { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 12px; max-width: 440px; padding: 20px; }
  dialog::backdrop { background: rgba(0,0,0,.6); }
  dialog code { display: block; background: #0B1220; border: 1px solid var(--line); border-radius: 6px; padding: 9px; font-size: .82rem; word-break: break-all; margin: 10px 0; }
  dialog p { font-size: .88rem; line-height: 1.6; color: var(--text-2); margin: 6px 0; }

  .col-btn, #search-btn, #search-close { display: none; }
  @media (max-width: 760px) {
    /* แถบบน: ปุ่มเล็กลง ช่องค้นหาเปิดเมื่อแตะแว่นขยาย */
    header { gap: 4px; padding-left: 8px; padding-right: 8px; }
    .brand { margin-right: auto; font-size: 1.1rem; }
    .brand span, #claude-btn { display: none; }
    .nav-btn { padding: 6px 7px; font-size: .8rem; }
    .search-wrap { display: none; }
    #search-btn { display: grid; place-items: center; width: 34px; height: 32px; padding: 0; }
    header.searching > :not(.search-wrap):not(#search-close) { display: none; }
    header.searching .search-wrap { display: block; flex: 1; min-width: 0; }
    header.searching #search-close { display: block; }
    #search { width: 100%; }
    #results { width: calc(100vw - 16px); right: auto; left: 8px; position: fixed; top: calc(56px + env(safe-area-inset-top)); max-height: 55dvh; }
    .lang button { padding: 5px 7px; }
    /* ช่องพิมพ์ขนาด 16px กันไม่ให้ iPhone ซูมหน้าจอเองตอนแตะ */
    input, select { font-size: 16px !important; }
    #legend { display: none; }
    #drawer, #vdrawer { left: 8px; right: 8px; width: auto; max-height: calc(100dvh - 150px); }
    /* แผงข้อมูลเป็น bottom sheet ไม่บังจอเกินครึ่ง */
    #left { left: 0; right: 0; width: auto; top: auto; bottom: calc(54px + env(safe-area-inset-bottom)); max-height: 42dvh; gap: 6px; padding: 0 6px 6px; }
    .card { padding: 10px 12px; border-radius: 12px; }
    .card.collapsed > :not(.info-head) { display: none; }
    /* ปุ่มติดตาม/เวลาผ่าน อยู่ใต้ชื่อเลย ไม่ต้องเลื่อนหา */
    #info:not(.collapsed):not([hidden]) { display: flex; flex-direction: column; }
    #info .actions { order: 1; }
    #info-live { order: 2; }
    #passes { order: 3; }
    .info-head { align-items: center; }
    .info-head > div:first-child { min-width: 0; flex: 1; }
    .info-name { font-size: .95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .info-sub { font-size: .74rem; }
    .card.collapsed .info-sub { display: none; }
    .col-btn { display: grid; place-items: center; width: 32px; height: 32px; background: #1B2740; border: 1px solid var(--line); border-radius: 8px; color: var(--text-2); flex: none; }
    .col-btn svg { transition: transform .2s; }
    .card.collapsed .col-btn svg { transform: rotate(180deg); }
    .x { font-size: 1.1rem; padding: 6px; }
    .heading { margin: 8px 0 2px; gap: 10px; }
    .arrow { width: 32px; height: 32px; }
    dl { grid-template-columns: 1fr 1fr; gap: 6px 14px; margin-top: 8px; }
    .kv { display: block; min-width: 0; }
    .kv dt { font-size: .68rem; line-height: 1.3; }
    .kv dd { text-align: left; font-size: .84rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .actions { margin-top: 8px; gap: 6px; }
    .btn { padding: 7px 10px; font-size: .8rem; }
    table { font-size: .74rem; }
    .note { font-size: .72rem; }
    /* รายการที่เลือก: ย่อเหลือป้ายเล็ก แตะเพื่อขยาย */
    #selector { right: 8px; width: auto; max-width: 70vw; padding: 6px 10px; }
    #selector:not(.expanded) #sel-list, #selector:not(.expanded) .sel-foot, #selector:not(.expanded) #sel-clear { display: none; }
    #selector.expanded { width: 240px; }
    #sel-title { cursor: pointer; display: flex; align-items: center; gap: 6px; }
    #sel-title::after { content: "▾"; color: var(--text-2); }
    #selector.expanded #sel-title::after { content: "▴"; }
    #sel-list { max-height: 30dvh; }
    #labels div { font-size: .64rem; }
    #labels div small { font-size: .58rem; }
    footer { gap: 8px; }
    .clock .t { font-size: .95rem; }
    .clock .d { display: none; }
    .status { display: none; }
    .tc button { width: 34px; }
    .speed { min-width: 48px; font-size: .74rem; }
  }
  @media (prefers-reduced-motion: reduce) { .arrow svg { transition: none; } }
</style>
</head>
<body>
<div id="globe"></div>

<header>
  <div class="brand">🛰️ <span data-i18n="brand"></span></div>
  <button class="nav-btn" id="groups-btn" aria-expanded="false" aria-controls="drawer" data-i18n="systems"></button>
  <button class="nav-btn" id="vessel-btn" aria-expanded="false" aria-controls="vdrawer" data-i18n="vessels"></button>
  <button class="nav-btn" id="view-btn"></button>
  <button class="nav-btn" id="obs-btn" aria-expanded="false" data-i18n="observer"></button>
  <button class="nav-btn" id="claude-btn" data-i18n="useClaude"></button>
  <button class="nav-btn" id="search-btn" aria-label="search"><svg width="16" height="16" viewBox="0 0 16 16"><circle cx="7" cy="7" r="5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M11 11l3.5 3.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
  <div class="search-wrap">
    <input type="search" id="search" autocomplete="off" data-i18n-placeholder="searchPh" aria-label="search">
    <ul id="results"></ul>
  </div>
  <button class="nav-btn" id="search-close" aria-label="close">✕</button>
  <div class="lang" role="group" aria-label="Language">
    <button data-lang="th" aria-pressed="true">ไทย</button>
    <button data-lang="en" aria-pressed="false">EN</button>
  </div>
</header>

<section id="drawer" aria-label="systems">
  <p class="panel-title" data-i18n="systems"></p>
  <ul class="groups" id="groups"></ul>
  <button class="btn" id="claude-btn2" style="margin-top:10px;width:100%" data-i18n="useClaude"></button>
</section>

<section id="vdrawer" aria-label="vessels">
  <p class="panel-title" data-i18n="shipsTitle"></p>
  <label class="ship-toggle"><input type="checkbox" id="ships-on"><span data-i18n="shipsShow"></span><span class="count num" id="ships-count"></span></label>
  <p class="note" id="ships-status"></p>
  <p class="panel-title sub" data-i18n="shipTypes"></p>
  <ul class="groups" id="ship-legend"></ul>
  <div class="ships-box">
    <p class="panel-title" data-i18n="histTitle"></p>
    <p class="note" id="hist-status"></p>
    <label class="ship-toggle"><input type="checkbox" id="rec-on" checked><span data-i18n="recLocal"></span><span></span></label>
    <button class="btn" id="rec-clear" style="margin-top:6px" data-i18n="recClear"></button>
  </div>
</section>

<aside id="legend">
  <p class="panel-title" data-i18n="legend"></p>
  <ul id="legend-list"></ul>
  <div class="total num" id="total"></div>
</aside>

<div id="labels"></div>

<div id="left">
  <section class="card" id="info" hidden></section>
  <section class="card" id="ship" hidden></section>
  <section class="card" id="obs" hidden></section>
</div>

<aside id="selector">
  <div style="display:flex;align-items:center"><strong style="font-size:.88rem" id="sel-title"></strong><button class="mini" id="sel-clear" style="margin-left:auto"></button></div>
  <ul id="sel-list"></ul>
  <div class="sel-foot"><label for="minel" data-i18n="covEl"></label>
    <select id="minel"><option value="0">0°</option><option value="10">10°</option><option value="25" selected>25°</option><option value="40">40°</option></select>
  </div>
</aside>

<footer>
  <div class="clock num"><span class="t" id="clock">--:--:--</span><span class="d" id="date"></span></div>
  <span class="status" id="status"></span>
  <div class="tc">
    <button id="slower" data-i18n-title="slower" aria-label="slower"><svg width="16" height="16" viewBox="0 0 16 16"><path d="M8 3v10L1 8zM15 3v10L8 8z" fill="currentColor"/></svg></button>
    <button id="play" data-i18n-title="pause" aria-label="pause"><svg width="16" height="16" viewBox="0 0 16 16" id="play-icon"><path d="M4 2h3v12H4zM9 2h3v12H9z" fill="currentColor"/></svg></button>
    <button id="faster" data-i18n-title="faster" aria-label="faster"><svg width="16" height="16" viewBox="0 0 16 16"><path d="M8 3v10l7-5zM1 3v10l7-5z" fill="currentColor"/></svg></button>
    <span class="speed num" id="speed">×1</span>
    <button id="reset" data-i18n-title="now" aria-label="now"><svg width="16" height="16" viewBox="0 0 16 16"><path d="M13.5 8A5.5 5.5 0 1 1 8 2.5c1.6 0 3 .7 4 1.8V2h1.5v4.8H8.7V5.3h2.4A4 4 0 1 0 12 8z" fill="currentColor"/></svg></button>
  </div>
</footer>

<div id="tip"></div>

<dialog id="claude-dlg">
  <h3 style="margin:0 0 6px" data-i18n="useClaude"></h3>
  <p data-i18n="claudeHelp"></p>
  <code id="mcp-url"></code>
  <p data-i18n="claudeEx"></p>
  <div class="actions"><button class="btn" id="copy" data-i18n="copy"></button><button class="btn" id="dlg-close" data-i18n="close"></button></div>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/satellite.js@6.0.2/dist/satellite.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
<script type="module">
import * as THREE from 'three';

const gName = g => lang === 'en' ? (EN_NAMES[g.id] || g.en || g.name) : g.name;
const dirText = deg => lang === 'en' ? COMPASS_EN[compassEn(deg)] : compassTh(deg);
const locale = () => lang === 'en' ? 'en-GB' : 'th-TH';
const nf = (x, d) => x.toLocaleString(locale(), { minimumFractionDigits: d, maximumFractionDigits: d });
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function applyLang() {
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-placeholder]').forEach(el => { el.placeholder = t(el.dataset.i18nPlaceholder); });
  document.querySelectorAll('[data-i18n-title]').forEach(el => { el.title = t(el.dataset.i18nTitle); el.setAttribute('aria-label', t(el.dataset.i18nTitle)); });
  document.querySelectorAll('.lang button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === lang)));
  renderGroups(); renderSelector(); renderInfo(); renderObs(); renderClock();
  renderShipLegend(); renderShipStatus(); renderShip(); renderHistStatus();
  if (typeof renderViewBtn === 'function') renderViewBtn();
}
document.querySelectorAll('.lang button').forEach(b => b.addEventListener('click', () => {
  lang = b.dataset.lang;
  try { localStorage.setItem('lang', lang); } catch {}
  applyLang();
}));

const RE = 6371;
function toXYZ(lat, lon, altKm, out, k = 0) {
  const r = 1 + altKm / RE, la = lat * Math.PI / 180, lo = lon * Math.PI / 180;
  out[k] = r * Math.cos(la) * Math.cos(lo);
  out[k + 1] = r * Math.sin(la);
  out[k + 2] = -r * Math.cos(la) * Math.sin(lo);
  return out;
}

function drawShips2d(X, Yp, W, H) {

  drawTrack2d(X, Yp, W, H);
  for (const v of shipVis) {
    const y = Yp(v.lat); if (y < -8 || y > H + 8) continue;

function idb() {

    const r = indexedDB.open('sattrack', 1);
    r.onupgradeneeded = () => { const st = r.result.createObjectStore('pts', { keyPath: ['mmsi', 't'] }); st.createIndex('t', 't'); };
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);

(async () => {

  st.index('t').openCursor(IDBKeyRange.upperBound(Date.now() - LOCAL_KEEP_MS)).onsuccess = e => { const c = e.target.result; if (c) { c.delete(); c.continue(); } };
  tx.oncomplete = () => { const q = db.transaction('pts').objectStore('pts').count(); q.onsuccess = () => { localCount = q.result; renderHistStatus(); }; };
})();

  if (!recOn || !list?.length) return;
  const db = await idb(); if (!db) return;
  const rows = [];
  for (const v of list) {
    if (v.lat == null || !v.t) continue;
    const tms = Date.parse(v.t), p = lastRec.get(v.mmsi);
    if (p) {
      const dt = (tms - p.t) / 1000; if (dt < 30) continue;
      if (groundKmLocal(p.lat, p.lon, v.lat, v.lon) * 1000 < 30 && dt < 600) continue;
    }
    const row = { mmsi: v.mmsi, t: tms, lat: v.lat, lon: v.lon, sog: v.sog ?? null, cog: v.cog ?? null };
    lastRec.set(v.mmsi, row); rows.push(row);
  }
  if (!rows.length) return;
  const tx = db.transaction('pts', 'readwrite'), st = tx.objectStore('pts');
  rows.forEach(r => st.put(r));
  tx.oncomplete = () => { localCount += rows.length; renderHistStatus(); };
}

    q.onsuccess = () => res(q.result.map(r => [r.t, r.lat, r.lon, r.sog, r.cog])); q.onerror = () => res([]);

}

  if (!trackOn || !trackPts.length) return;
  const u = []; let off = 0;
  trackPts.forEach((p, i) => { if (i) { const d = p[2] - trackPts[i - 1][2]; if (d > 180) off -= 360; else if (d < -180) off += 360; } u.push([p[2] + off, p[1], i]); });
  const base = nearShift(u[u.length - 1][0]);
  for (const d of [-360, 0, 360]) {
    const sh = base + d;
    mctx.strokeStyle = 'rgba(255,212,59,.9)'; mctx.lineWidth = 2; mctx.beginPath();
    u.forEach(([l, la], i) => { const x = X(l + sh), y = Yp(la); i ? mctx.lineTo(x, y) : mctx.moveTo(x, y); });
    mctx.stroke();
    mctx.fillStyle = '#FFD43B';
    for (const [l, la, i] of u) {
      const x = X(l + sh), y = Yp(la); if (x < -6 || x > W + 6 || y < -6 || y > H + 6) continue;
      mctx.beginPath(); mctx.arc(x, y, 2.2, 0, 6.2832); mctx.fill();
      trkHits2d.push(x, y, i);
    }
    const [l0, la0] = u[0], x0 = X(l0 + sh), y0 = Yp(la0);
    mctx.strokeStyle = '#FFD43B'; mctx.lineWidth = 2; mctx.beginPath(); mctx.arc(x0, y0, 5, 0, 6.2832); mctx.stroke();
  }
}
function trackHitAt(cx, cy) {
  let best = -1, bd = 36;
  for (let k = 0; k < trkHits2d.length; k += 3) { const d = (trkHits2d[k] - cx) ** 2 + (trkHits2d[k + 1] - cy) ** 2; if (d < bd) { bd = d; best = trkHits2d[k + 2]; } }
  return best;
}
function trackTip(i) {
  const p = trackPts[i]; if (!p) return '';
  return `${new Date(p[0]).toLocaleString(locale(), { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' })}${p[3] != null ? ` · ${nf(p[3], 1)} ${t('kn')}` : ''}${p[4] != null ? ` · ${Math.round(p[4])}°` : ''}`;
}

// ---------------- มือถือ ----------------
const mq = window.matchMedia('(max-width: 760px)');
function isMobile() { return mq.matches; }
mq.addEventListener?.('change', () => { renderViewBtn(); });
// ย่อ/ขยายการ์ด: บนมือถือให้เปิดทีละการ์ด จะได้ไม่ล้นจอ
function expandCard(id) {
  const card = $(id); card.classList.remove('collapsed');
  if (isMobile()) ['info', 'obs', 'ship'].filter(x => x !== id).forEach(x => $(x).classList.add('collapsed'));
}
$('left').addEventListener('click', e => {
  if (e.target.closest('.x')) return;
  const head = e.target.closest('.info-head'); if (!head) return;
  if (!e.target.closest('[data-collapse]') && !isMobile()) return;
  const card = head.closest('.card');
  if (card.classList.contains('collapsed')) expandCard(card.id); else card.classList.add('collapsed');
});
$('sel-title').addEventListener('click', () => $('selector').classList.toggle('expanded'));
if (!isMobile()) $('selector').classList.add('expanded');
// ช่องค้นหาบนมือถือ
$('search-btn').addEventListener('click', e => { e.stopPropagation(); document.querySelector('header').classList.add('searching'); $('search').focus(); });
$('search-close').addEventListener('click', () => { document.querySelector('header').classList.remove('searching'); $('search').value = ''; $('results').classList.remove('open'); });
// เลื่อนภาพขึ้นให้ดาวเทียมที่ติดตามอยู่ในส่วนที่ไม่ถูก bottom sheet บัง
function updateSheetOffset() {
  const left = $('left'), visible = isMobile() && [...left.children].some(c => !c.hidden);
  const off = visible ? Math.round(left.getBoundingClientRect().height / 2) : 0;
  if (off === sheetOffset) return;
  sheetOffset = off;
  const W = window.innerWidth, H = window.innerHeight;
  if (off) camera.setViewOffset(W, H, 0, off, W, H); else camera.clearViewOffset();
  camera.updateProjectionMatrix();
}

// ---------------- loop ----------------
let lastFrame = performance.now(), lastUpdate = 0;
const camDir = new THREE.Vector3();
function placeLabels() {
  const W = window.innerWidth, H = window.innerHeight;
  for (const s of sels) {
    if (!s.ring.visible) { s.label.style.display = 'none'; continue; }
    const p = s.ring.position, sc = screenOf(p, W, H);
    const show = sc.z < 1 && visibleFromCamera(p.x, p.y, p.z) && sc.x > -50 && sc.x < W + 50 && sc.y > -50 && sc.y < H + 50;
    s.label.style.display = show ? 'block' : 'none';
    if (show) s.label.style.left = sc.x + 'px', s.label.style.top = sc.y + 'px';
  }
}
function frame(now) {
  const dt = now - lastFrame; lastFrame = now;
  updateSheetOffset();
  if (!paused) simMs += dt * SPEEDS[speedIdx];
  const interval = (!paused && SPEEDS[speedIdx] !== 1) ? 200 : 1000;
  if (now - lastUpdate > interval) { lastUpdate = now; updateAll(); }
  if (view === '2d') { follow2d(dt); if (dirty2d) { dirty2d = false; draw2d(); } requestAnimationFrame(frame); return; }
  const fp = following ? followTargetLL() : null;
  if (fp) {
    const dist = camera.position.length();
    camDir.copy(toVec(fp.lat, fp.lon, fp.alt || 0)).normalize().multiplyScalar(dist);
    camera.position.lerp(camDir, 1 - Math.exp(-dt / 180));
    camera.position.setLength(dist);
  }
  controls.update();
  renderer.render(scene, camera);
  placeLabels();
  requestAnimationFrame(frame);
}

setView(view);
applyLang();
GROUPS.filter(g => g.on).forEach(g => loadGroup(state[g.id]));
setInterval(() => setStatus(t('updated', new Date().toLocaleTimeString(locale()))), 5000);
requestAnimationFrame(frame);
</script>
